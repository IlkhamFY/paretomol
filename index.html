<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive multi-objective Pareto analysis of drug-like molecules. Rank by MW, LogP, HBD, HBA, TPSA, RotBonds. Properties and ranking computed in your browser; ADMET predictions and name lookups use public services." />
    <meta name="author" content="Ilkham Yabbarov" />
    <meta name="keywords" content="drug discovery, Pareto, multi-objective, SMILES, Lipinski, ADMET, cheminformatics, RDKit" />

    <!-- Open Graph -->
    <meta property="og:title" content="ParetoMol — Multi-Objective Molecule Analysis" />
    <meta property="og:description" content="Free, open-source Pareto analysis for drug discovery. 14 interactive views, 41 ADMET predictions, drug-likeness filters. Computed in your browser; ADMET predictions and name lookups use public services." />
    <meta property="og:url" content="https://paretomol.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ParetoMol" />
    <meta property="og:image" content="https://paretomol.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ParetoMol — Multi-Objective Molecule Analysis" />
    <meta name="twitter:description" content="Pareto ranking, drug filters, AI copilot — all in the browser. Open source." />
    <meta name="twitter:image" content="https://paretomol.com/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://paretomol.com" />
    <link rel="alternate" type="text/plain" title="LLM guide" href="/llms.txt" />
    <title>ParetoMol — Multi-Objective Molecule Analysis</title>
    <!--
      RDKit's loader uses new Function, so script-src needs unsafe-eval.
      wasm-unsafe-eval covers compiling the vendored WASM. 3Dmol is loaded
      from this origin only when a 3D view opens. connect-src is the ADMET
      Space plus the opt-in services named in llms.txt, and GoatCounter.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://gc.zgo.at; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.hf.space https://huggingface.co https://pubchem.ncbi.nlm.nih.gov https://www.ebi.ac.uk https://cartblanche22.docking.org https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://paretomol.goatcounter.com https://gc.zgo.at; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="stylesheet" href="/boot.css" />
    <script src="/theme-init.js"></script>
    <script src="/rdkit/RDKit_minimal.js"></script>
    <script src="/goatcounter.js"></script>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ParetoMol",
      "url": "https://paretomol.com",
      "description": "Interactive multi-objective Pareto analysis of drug-like molecules. Rank by MW, LogP, HBD, HBA, TPSA, RotBonds. Properties and ranking computed in your browser; ADMET predictions and name lookups use public services.",
      "applicationCategory": "ScienceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": [
        {
          "@type": "Person",
          "name": "Ilkham Yabbarov",
          "url": "https://ilkham.com"
        },
        {
          "@type": "Person",
          "name": "Rodrigo A. Vargas-Hernández",
          "url": "https://ravh.ca"
        }
      ],
      "license": "https://opensource.org/licenses/MIT",
      "isAccessibleForFree": true,
      "browserRequirements": "Requires a modern browser with WebAssembly support"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

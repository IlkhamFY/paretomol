name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build -w @paretomol/core -w @paretomol/cli -w @paretomol/mcp
      - name: One version across core, cli and mcp
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const v=JSON.parse(readFileSync('packages/core/package.json','utf8')).version; for (const name of ['cli','mcp']) { const got=JSON.parse(readFileSync('packages/'+name+'/package.json','utf8')).version; if (got!==v) throw new Error(name+' is '+got+', core is '+v); } console.log(v);"
      - run: npm publish -w @paretomol/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @paretomol/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @paretomol/mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

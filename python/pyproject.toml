[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paretomol"
version = "0.1.0"
description = "Pareto ranking, scoring profiles and decision records for ParetoMol."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Ilkham Yabbarov", email = "ilkhamfy@gmail.com" }]
keywords = ["chemistry", "pareto", "drug-discovery", "mpo"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = ["lzstring>=1.0.4"]

[project.optional-dependencies]
rdkit = ["rdkit>=2023.9"]

[project.urls]
Homepage = "https://paretomol.com"
Repository = "https://github.com/IlkhamFY/paretomol"
Changelog = "https://github.com/IlkhamFY/paretomol/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/paretomol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

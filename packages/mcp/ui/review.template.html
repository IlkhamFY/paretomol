<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParetoMol review</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2;
    --card: #fffcf7;
    --text: #1c1b19;
    --muted: #6e6a62;
    --line: #e4e0d8;
    --accent: #5f7367;
    --accent-ink: #f7f6f2;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413;
    --card: #1c1c1a;
    --text: #f3f1ea;
    --muted: #a39e94;
    --line: #2e2c28;
    --accent: #8aa394;
    --accent-ink: #141413;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 20px 120px; }
  .kicker {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .meta, .note, .fallback, .status { color: var(--muted); font-size: 13px; }
  .meta { margin: 6px 0 0; }
  .note { margin: 12px 0 0; white-space: pre-wrap; }
  .fallback { margin: 12px 0 0; }
  .fallback a { color: var(--accent); }
  .status { margin: 12px 0 0; }
  .rows { margin-top: 18px; border-top: 1px solid var(--line); }
  .row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .row[data-verdict="reject"] { opacity: 0.55; }
  .row svg { width: 180px; height: auto; display: block; }
  .struct {
    min-height: 96px;
    background: var(--card);
    border-radius: 8px;
  }
  .name { font-weight: 600; }
  .suggested { margin-left: 8px; font-size: 12px; font-weight: 500; color: var(--accent); }
  .facts { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .toggle {
    font: inherit;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .toggle[aria-pressed="true"][data-v="accept"] {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-ink);
  }
  .toggle[aria-pressed="true"][data-v="reject"] {
    border-color: var(--text);
    color: var(--muted);
  }
  .bar {
    position: sticky;
    bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    border-top: 1px solid var(--line);
    padding: 12px 20px 16px;
  }
  .bar-inner { max-width: 760px; margin: 0 auto; }
  .counts { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  textarea {
    width: 100%;
    min-height: 64px;
    resize: vertical;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
  }
  .export {
    margin-top: 8px;
    width: 100%;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  .export:disabled { opacity: 0.5; cursor: default; }
  .record {
    margin-top: 12px;
    font: 12px/1.4 ui-monospace, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    max-height: 240px;
    overflow: auto;
  }
  a.download { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 13px; }
  button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
    .row svg { width: 160px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker" id="experimental">Experimental</p>
    <h1 id="title">Review</h1>
    <p class="meta" id="meta"></p>
    <p class="note" id="note" hidden></p>
    <p class="fallback" id="fallback"></p>
    <p class="status" id="status" role="status"></p>
    <div class="rows" id="rows"></div>
  </div>
  <div class="bar">
    <div class="bar-inner">
      <p class="counts" id="counts" data-testid="review-counts">0 accepted, 0 rejected, 0 undecided</p>
      <textarea id="rationale" aria-label="Review rationale" placeholder="Why these picks? Saved as the rationale."></textarea>
      <button type="button" class="export" id="export" data-testid="review-export" disabled>Export decision record</button>
      <pre class="record" id="record" data-testid="review-record" hidden></pre>
      <a class="download" id="download" hidden>Download decision record</a>
    </div>
  </div>
  <script>/*__APP__*/</script>
</body>
</html>
